<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéPicker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/pokebox.css">
    <link rel="stylesheet" href="styles/images.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/scoreboard.css">
    <script src="js/pokepicker.js" defer></script>
    <script src="js/settingsModal.js" defer></script>
    <script src="js/scoreboard.js" defer></script>
    <script src="js/addScoreboard.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=discover_tune" />
</head>

<body>   
    <button class="btn-config" id="btnConfig"><span class="material-symbols-outlined">discover_tune</span></button>

    
    <div class="pokebox-config">
        <p>Settings</p>
        <label for="modes">Choose a mode:</label>
        <select name="modes" id="modes">
            <option value="upTo">Up to</option>
            <option value="only">Only</option>
        </select>
        <label for="generations">Choose a generation:</label>
        <select name="generations" id="generations">
            <option value=151>Generation 1</option>
            <option data-start-at=151 value=251>Generation 2</option>
            <option data-start-at=251 value=386>Generation 3</option>
            <option data-start-at=386 value=493>Generation 4</option>
            <option data-start-at=493 value=649>Generation 5</option>
            <option data-start-at=649 value=721>Generation 6</option>
            <option data-start-at=721 value=809>Generation 7</option>
            <option data-start-at=809 value=905>Generation 8</option>
            <option selected data-start-at=905 value=1025>Generation 9</option>
        </select>
        <button class="btn-save" id="btnSave">Save</button>
        <button class="btn-save" id="btnAddPlayer">Add Player</button>
        <p>PokéPicker by horue</p>

    </div>

    <div class="main-frame" onclick="getPokemon()">

            <div class="pokebox">

                <div class="pokemon-image-box">
                    <img id="pokemonImage" src="" alt="alternatetext" class="pokemon-images"> 
                </div>

                <h2 id="pokemonName" class="pokemon-name">-</h2>
                <h2 id="pokemonNumber" class="pokemon-number">#0000</h2>

                <div class="type-box">
                    <img id="type1" src="" alt="Type 1">
                    <img id="type2" src="" alt="Type 2">
                </div>

            </div> 

    </div>
    <div class="scoreboard-container" id="scoreboard-container"></div>

</body>
</html>
